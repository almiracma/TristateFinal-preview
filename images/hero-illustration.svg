<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#042f2e" flood-opacity="0.1"/>
    </filter>
    <clipPath id="roundRect1">
      <rect x="40" y="30" width="520" height="440" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background card -->
  <rect x="40" y="30" width="520" height="440" rx="24" fill="url(#bgGrad)" filter="url(#shadow1)"/>

  <!-- Grid pattern overlay -->
  <g clip-path="url(#roundRect1)" opacity="0.04">
    <line x1="40" y1="80" x2="560" y2="80" stroke="#065f46" stroke-width="1"/>
    <line x1="40" y1="130" x2="560" y2="130" stroke="#065f46" stroke-width="1"/>
    <line x1="40" y1="180" x2="560" y2="180" stroke="#065f46" stroke-width="1"/>
    <line x1="40" y1="230" x2="560" y2="230" stroke="#065f46" stroke-width="1"/>
    <line x1="40" y1="280" x2="560" y2="280" stroke="#065f46" stroke-width="1"/>
    <line x1="40" y1="330" x2="560" y2="330" stroke="#065f46" stroke-width="1"/>
    <line x1="40" y1="380" x2="560" y2="380" stroke="#065f46" stroke-width="1"/>
    <line x1="40" y1="430" x2="560" y2="430" stroke="#065f46" stroke-width="1"/>
    <line x1="140" y1="30" x2="140" y2="470" stroke="#065f46" stroke-width="1"/>
    <line x1="240" y1="30" x2="240" y2="470" stroke="#065f46" stroke-width="1"/>
    <line x1="340" y1="30" x2="340" y2="470" stroke="#065f46" stroke-width="1"/>
    <line x1="440" y1="30" x2="440" y2="470" stroke="#065f46" stroke-width="1"/>
  </g>

  <!-- Large central shield -->
  <g transform="translate(300, 220)" filter="url(#shadow2)">
    <path d="M0-130 C60-130 100-110 100-70 L100 30 C100 90 50 130 0 150 C-50 130 -100 90 -100 30 L-100-70 C-100-110 -60-130 0-130Z" fill="url(#shield)" opacity="0.95"/>
    <path d="M0-110 C50-110 80-95 80-60 L80 25 C80 75 40 110 0 125 C-40 110 -80 75 -80 25 L-80-60 C-80-95 -50-110 0-110Z" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
    <!-- Checkmark in shield -->
    <path d="M-30 10 L-10 35 L35-25" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Fire icon (top-left) -->
  <g transform="translate(115, 110)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="42" fill="white"/>
    <circle cx="0" cy="0" r="38" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <path d="M0-18 C8-8 16 0 16 10 C16 19 9 26 0 26 C-9 26 -16 19 -16 10 C-16 0 -8-8 0-18Z" fill="url(#amber)"/>
    <path d="M0-4 C4 2 8 6 8 11 C8 16 4 19 0 19 C-4 19 -8 16 -8 11 C-8 6 -4 2 0-4Z" fill="#fef3c7"/>
  </g>

  <!-- Security camera icon (top-right) -->
  <g transform="translate(485, 110)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="42" fill="white"/>
    <circle cx="0" cy="0" r="38" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <rect x="-5" y="-8" width="22" height="16" rx="3" fill="url(#emerald)" transform="rotate(-15)"/>
    <circle cx="-12" cy="2" r="6" fill="url(#emerald)"/>
    <rect x="-14" y="12" width="4" height="10" rx="2" fill="#065f46"/>
    <rect x="-20" y="20" width="16" height="3" rx="1.5" fill="#065f46"/>
  </g>

  <!-- Sprinkler icon (bottom-left) -->
  <g transform="translate(115, 380)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="42" fill="white"/>
    <circle cx="0" cy="0" r="38" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <!-- Sprinkler head -->
    <rect x="-3" y="-22" width="6" height="14" rx="2" fill="#065f46"/>
    <ellipse cx="0" cy="-6" rx="12" ry="4" fill="#065f46"/>
    <!-- Water drops -->
    <circle cx="-14" cy="6" r="2.5" fill="#3b82f6" opacity="0.7"/>
    <circle cx="-8" cy="12" r="2" fill="#3b82f6" opacity="0.5"/>
    <circle cx="0" cy="8" r="2.5" fill="#3b82f6" opacity="0.7"/>
    <circle cx="8" cy="14" r="2" fill="#3b82f6" opacity="0.5"/>
    <circle cx="14" cy="6" r="2.5" fill="#3b82f6" opacity="0.7"/>
    <circle cx="-18" cy="16" r="1.5" fill="#3b82f6" opacity="0.3"/>
    <circle cx="18" cy="16" r="1.5" fill="#3b82f6" opacity="0.3"/>
  </g>

  <!-- Monitoring/24-7 icon (bottom-right) -->
  <g transform="translate(485, 380)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="42" fill="white"/>
    <circle cx="0" cy="0" r="38" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
    <!-- Clock face -->
    <circle cx="0" cy="-2" r="18" fill="none" stroke="#065f46" stroke-width="2.5"/>
    <!-- Clock hands -->
    <line x1="0" y1="-2" x2="0" y2="-12" stroke="#065f46" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-2" x2="8" y2="2" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-2" r="2" fill="#d97706"/>
    <!-- 24/7 text -->
    <text x="0" y="28" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#065f46">24/7</text>
  </g>

  <!-- Connecting lines from icons to shield -->
  <g opacity="0.15" stroke="#065f46" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="150" y1="130" x2="220" y2="180"/>
    <line x1="450" y1="130" x2="380" y2="180"/>
    <line x1="150" y1="360" x2="220" y2="310"/>
    <line x1="450" y1="360" x2="380" y2="310"/>
  </g>

  <!-- Accent dots decoration -->
  <circle cx="80" cy="250" r="4" fill="#d97706" opacity="0.3"/>
  <circle cx="520" cy="250" r="4" fill="#d97706" opacity="0.3"/>
  <circle cx="300" cy="60" r="3" fill="#059669" opacity="0.2"/>
  <circle cx="300" cy="440" r="3" fill="#059669" opacity="0.2"/>

  <!-- Small floating badges -->
  <g transform="translate(210, 90)" filter="url(#shadow2)">
    <rect x="-28" y="-12" width="56" height="24" rx="12" fill="#065f46"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="white">FIRE</text>
  </g>

  <g transform="translate(390, 90)" filter="url(#shadow2)">
    <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#d97706"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="white">SECURITY</text>
  </g>

  <g transform="translate(210, 410)" filter="url(#shadow2)">
    <rect x="-44" y="-12" width="88" height="24" rx="12" fill="#065f46"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="white">SPRINKLER</text>
  </g>

  <g transform="translate(390, 410)" filter="url(#shadow2)">
    <rect x="-48" y="-12" width="96" height="24" rx="12" fill="#d97706"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="white">MONITORING</text>
  </g>
</svg>